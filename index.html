<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23222E50'/%3E%3Crect x='13' y='17' width='30' height='30' rx='7' fill='none' stroke='%23FFFFFF' stroke-width='5'/%3E%3Cpath d='M20 32l7 7 16-17' fill='none' stroke='%238DB6B4' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='15' r='7' fill='%23EF6461'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#222E50">
</head><body>
<title>Carnet de tâches pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : barre latérale de filtres (thèmes, personnes) + colonne de travail (saisie rapide, liste groupée par thème) */
:root{
  /* Palette : Space Indigo #222E50 · Dark Cyan #588B8B · Raw Umber #874000 · Vibrant Coral #EF6461 · White */
  --bg:#ECEDF0; --shell:#F7F7F9; --surface:#FFFFFF; --sunk:#F0F1F4; --ink:#1B1F2B; --muted:#6E7383; --line:#E7E8EC;
  --accent:#222E50; --accent-ink:#FFFFFF; --urgent:#EF6461; --urgent-ink:#D2433F; --late:#874000; --ok:#588B8B;
  --f-display:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,24,40,.04), 0 4px 14px rgba(20,24,40,.05);
  --shadow-lg:0 1px 2px rgba(20,24,40,.04), 0 12px 32px rgba(20,24,40,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1220; --shell:#141929; --surface:#1B2135; --sunk:#232A41; --ink:#EDEFF4; --muted:#A1A8BC; --line:#2A3149;
  --accent:#9CC2C2; --accent-ink:#12172A; --urgent:#EF6461; --urgent-ink:#F58A87; --late:#D08A4E; --ok:#6FA6A6;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 8px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1220; --shell:#141929; --surface:#1B2135; --sunk:#232A41; --ink:#EDEFF4; --muted:#A1A8BC; --line:#2A3149;
  --accent:#9CC2C2; --accent-ink:#12172A; --urgent:#EF6461; --urgent-ink:#F58A87; --late:#D08A4E; --ok:#6FA6A6;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start;
  background:var(--shell);border-radius:28px;padding:24px 24px 30px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 20px 60px rgba(20,24,40,.06)}

/* En-tête */
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 8px 4px}
.brand .logo{width:34px;height:34px;flex:none;line-height:0}
.brand .logo svg{width:34px;height:34px}
.brand .bname{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.1}
.hello{display:flex;flex-direction:column;gap:4px}
.hello h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em;margin:0;line-height:1.1;text-wrap:balance}
.hello p{margin:0;color:var(--muted);font-size:13px}

/* Barre latérale */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;gap:20px}
.side h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px 6px}
.nav{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:0;padding:7px 10px;border-radius:12px;text-align:left;min-width:0;font-size:14px}
.nav button:hover{background:color-mix(in oklab,var(--surface) 70%,transparent)}
.nav button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .sub button{padding-left:28px;font-size:14px}
.dot{width:12px;height:12px;border-radius:4px;background:var(--c,var(--muted));flex:none}
.sub .dot{width:7px;height:7px;border-radius:50%}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 10px;text-align:left;font-size:13px}
.linkbtn:hover{text-decoration:underline}

/* Colonne principale */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:12px}
.stat-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 18px 10px 12px;box-shadow:var(--shadow);min-width:0}
.stat-card .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in oklab,var(--c) 13%,var(--surface));color:var(--c)}
.stat-card b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stat-card span.l{font-size:14px;color:var(--ink);white-space:nowrap}

.add{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
.add .title{border:0;background:transparent;font-size:15px;padding:6px 8px;width:100%;outline:none}
.add .title::placeholder{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.field{background:var(--sunk);border:1px solid transparent;border-radius:9px;padding:5px 9px;font-size:13px;min-width:0}
.field:hover{border-color:var(--line)}
select.field{padding-right:4px;max-width:200px}
input.who{width:150px}
input[type=date].field{font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:500}
.toggle[aria-pressed="true"]{background:var(--urgent);border-color:var(--urgent);color:#fff}
.toggle.soft[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:6px 16px;font-weight:600;font-size:13px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--urgent-ink);border:1px solid color-mix(in oklab,var(--urgent) 40%,transparent)}
.btn.danger.armed{background:var(--urgent);color:#fff}
.spacer{flex:1}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.view-sec{display:flex;flex-direction:column;gap:8px}
.view-sec h2{margin-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .toggle{font-size:12px;padding:3px 9px}
.search{width:100%;background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:7px 12px;font-size:13px;min-width:0}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:color-mix(in oklab,var(--accent) 10%,var(--surface));border:1px dashed color-mix(in oklab,var(--accent) 45%,transparent);border-radius:var(--r);padding:9px 14px;font-size:14px}

/* Liste */
.group{display:flex;flex-direction:column;gap:10px;background:color-mix(in oklab,var(--surface) 55%,var(--shell));border-radius:20px;padding:14px 12px 12px;min-width:0;border:1px solid color-mix(in oklab,var(--line) 60%,transparent)}
.urgent-group{background:var(--surface);box-shadow:var(--shadow-lg);border-color:transparent}
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:0 4px}
.gtitle{display:flex;align-items:center;gap:10px;min-width:0}
.ghead h3{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.03em;margin:0;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.ghead .n{font-size:12px;font-weight:700;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 7px;box-shadow:0 1px 2px rgba(20,24,40,.06)}
.gsub{grid-column:1;margin:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold{grid-column:2;grid-row:1/span 2;background:none;border:0;color:var(--muted);width:28px;height:28px;border-radius:10px;display:grid;place-items:center}
.fold:hover{background:var(--sunk);color:var(--ink)}
.fold svg{transition:transform .2s}
.fold[aria-expanded="false"] svg{transform:rotate(180deg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 8px 9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(20,24,40,.03)}
.task:hover{box-shadow:var(--shadow)}
.task.urgent{border-color:color-mix(in oklab,var(--urgent) 35%,var(--line))}
.lead{display:flex;align-items:center;gap:4px}
.handle{background:none;border:0;padding:3px 4px;margin:0 0 0 -10px;color:var(--muted);opacity:.35;cursor:grab;touch-action:none;border-radius:5px;line-height:0}
.handle-sp{width:18px;margin-left:-8px;flex:none}
.task:hover .handle,.handle:focus-visible{opacity:1}
.handle:hover{background:var(--sunk)}
.task.dragging{position:relative;z-index:2;box-shadow:0 6px 20px rgba(20,24,40,.18);background:var(--surface);cursor:grabbing}
.task.dragging .handle{cursor:grabbing;opacity:1}
@media (hover:none){.handle{opacity:.7}}
.check{appearance:none;width:18px;height:18px;border:1.5px solid color-mix(in oklab,var(--muted) 70%,transparent);border-radius:7px;margin:0;display:grid;place-items:center;background:var(--surface);cursor:pointer}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.tbody{min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.ttitle{font-weight:700;font-size:14px;letter-spacing:-.01em;overflow-wrap:anywhere}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tnotes{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
  background:color-mix(in oklab,var(--c) 15%,var(--surface));color:color-mix(in oklab,var(--c) 72%,var(--ink));white-space:nowrap}
.chip.sub{background:transparent;border:1px solid color-mix(in oklab,var(--c) 40%,transparent);font-weight:500}
.chip.sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill-u{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--urgent);padding:2px 7px;border-radius:5px}
.side-meta{display:flex;align-items:center;gap:16px;justify-content:flex-end;flex-wrap:wrap}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);white-space:nowrap}
.due svg{color:var(--urgent);flex:none}
.due.late{color:var(--late);font-weight:600}
.due.late svg{color:var(--late)}
.due.today{font-weight:600}
.who-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.kebab{background:none;border:0;color:var(--muted);width:26px;height:26px;border-radius:10px;display:grid;place-items:center}
.kebab:hover{background:var(--sunk);color:var(--ink)}
.av{width:22px;height:22px;border:2px solid var(--surface);font-size:9px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:var(--avc,#5A6893);flex:none}
.urgent-group .ghead h3{color:var(--ink)}
.urgent-group .meta .pill-u{display:none}
.creator{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--sunk);border-radius:10px;padding:10px 12px}
.creator .ctitle{font-size:13px;font-weight:600;color:var(--muted);width:100%}
.creator .field{background:var(--surface);flex:1 1 180px}
.tmid{min-width:0;display:flex;flex-direction:column;gap:6px}
.cl{list-style:none;margin:0;padding:0 0 0 2px;display:flex;flex-direction:column;gap:3px}
.cl label{display:flex;align-items:flex-start;gap:7px;font-size:13px;cursor:pointer}
.cl label span{overflow-wrap:anywhere}
.cl-more{align-self:flex-start;background:none;border:0;padding:2px 0;font-size:12px;font-weight:600;color:var(--muted)}
.cl-more:hover{color:var(--accent);text-decoration:underline}
.cl li.ok span{color:var(--muted);text-decoration:line-through}
.check.sm{width:16px;height:16px;border-width:1.5px;border-radius:4px;margin-top:2px;flex:none}
.check.sm:checked::after{width:7px;height:4px}
.prog{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.prog .bar{width:44px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--accent)}
.prog.full .bar span{background:var(--ok)}
.cledit{display:flex;flex-direction:column;gap:6px}
.cledit .item{display:flex;align-items:center;gap:8px}
.cledit .item .field{flex:1;min-width:0}
.board{display:flex;flex-direction:column;gap:20px}
.board.cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(230px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:4px}
.board.cols .group{padding:12px 8px 8px}
.board.cols .ghead h3{font-size:16px}
.board .meta .chip:not(.sub){display:none}
.board.cols .task{grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:9px 4px 9px 10px;align-items:start}
.board.cols .lead,.board.cols .kebab{margin-top:-2px}
.board.cols .side-meta{grid-column:2;grid-row:2;justify-content:flex-start;gap:10px}
.board.cols .kebab{grid-column:3;grid-row:1}
.board.cols .side-meta{gap:8px}
.board.cols .due{white-space:normal;align-items:flex-start}
.board.cols .due svg{margin-top:1px}
.side-meta:not(:has(*)){display:none}
.board.cols .tnotes{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.recur-hint{margin:0;align-self:end;font-size:13px;color:var(--muted);min-height:1em}
.chip.rec{background:transparent;border:1px dashed color-mix(in oklab,var(--ok) 60%,transparent);color:color-mix(in oklab,var(--ok) 80%,var(--ink));font-weight:500}
.list.calm{padding:16px 18px;color:var(--muted);font-size:14px;background:var(--sunk);border-radius:16px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-bottom:4px}
.donebar{color:var(--muted);font-size:14px}

/* Dialogues */
dialog{border:0;border-radius:26px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,12,20,.45)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:24px}
.dlg h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.03em}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dlg .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dlg label .field{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:15px;max-width:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea.field{min-height:80px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;background:var(--c);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.sw.sm{width:16px;height:16px;border-radius:50%}
.tcard{border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tcard .tname{font-family:var(--f-display);font-weight:800;font-size:16px;flex:1;min-width:0}
.subs{display:flex;flex-direction:column;gap:6px;padding-left:4px}
.subrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subrow .field{flex:1 1 140px}
.iconbtn{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:6px;font-size:13px}
.iconbtn:hover{background:var(--sunk);color:var(--urgent-ink)}
.iconbtn.armed{background:var(--urgent);color:#fff}
.themes-list{display:flex;flex-direction:column;gap:10px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:980px){
  .app{grid-template-columns:190px minmax(0,1fr);gap:18px;padding:18px}
  .task{grid-template-columns:auto minmax(0,1fr) auto;align-items:start}
  .side-meta{grid-column:2;grid-row:2;justify-content:flex-start;gap:10px}
  .kebab{grid-column:3;grid-row:1}
}
@media (max-width:560px){
  body{padding-block:12px 32px}
  .app{grid-template-columns:minmax(0,1fr);gap:18px;padding:16px;border-radius:22px}
  .hello h1{font-size:22px}
  .board.cols{grid-template-columns:minmax(0,1fr);overflow:visible}
  .group{padding:16px 10px 10px;border-radius:20px}
  .side{position:static;gap:12px}
  .side h2{margin-left:0}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav button{width:auto;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px}
  .nav .sub button{padding-left:10px}
  .nav .lbl{white-space:nowrap}
  .grid2{grid-template-columns:1fr}

  input.who{width:130px}
}
@media (prefers-reduced-motion:no-preference){ .task,.nav button,.toggle{transition:background .15s, border-color .15s} }
</style>

<div class="app">
  <aside class="side" aria-label="Filtres">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#222E50"/><rect x="13" y="17" width="30" height="30" rx="7" fill="none" stroke="#fff" stroke-width="5"/><path d="M20 32l7 7 16-17" fill="none" stroke="#8DB6B4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="15" r="7" fill="#EF6461"/></svg></span>
      <span class="bname">Carnet de tâches</span>
    </div>
    <section class="view-sec">
      <h2>Affichage</h2>
      <input class="search" id="q" type="search" placeholder="Rechercher…" aria-label="Rechercher une tâche ou une personne">
      <div class="opts">
        <button class="toggle soft" id="t-group" type="button" aria-pressed="true">Grouper par thème</button>
        <button class="toggle soft" id="t-cols" type="button" aria-pressed="true">Thèmes en colonnes</button>
        <button class="toggle soft" id="t-done" type="button" aria-pressed="false">Afficher terminées</button>
      </div>
    </section>
    <section>
      <h2>Thèmes</h2>
      <ul class="nav" id="nav-themes"></ul>
      <button class="linkbtn" id="open-themes" type="button">Gérer les thèmes et couleurs</button>
    </section>
    <section>
      <h2>Sauvegarde</h2>
      <div class="nav">
        <button class="linkbtn" id="exp" type="button">Exporter mes tâches (.json)</button>
        <button class="linkbtn" id="imp" type="button">Importer un fichier…</button>
        <input type="file" id="imp-file" accept=".json,application/json" hidden>
      </div>
    </section>
    <section id="people-sec">
      <h2>Attribuées à</h2>
      <ul class="nav" id="nav-people"></ul>
    </section>
  </aside>

  <main class="main">
    <header class="hello">
      <h1 id="hello">Bonjour !</h1>
      <p id="today"></p>
    </header>
    <div class="summary" id="summary"></div>

    <form class="add" id="add-form" autocomplete="off">
      <input class="title" id="a-title" placeholder="Nouvelle tâche… (Entrée pour ajouter)" aria-label="Intitulé de la tâche">
      <div class="row">
        <select class="field" id="a-theme" aria-label="Thème"></select>
        <select class="field" id="a-sub" aria-label="Sous-thème"></select>
        <input class="field who" id="a-who" list="people-list" placeholder="Attribuer à…" aria-label="Attribuer à">
        <input class="field" id="a-due" type="date" aria-label="Échéance">
        <button class="toggle" id="a-urgent" type="button" aria-pressed="false">Urgent</button>
        <span class="spacer"></span>
        <button class="btn" type="submit">Ajouter</button>
      </div>
      <div class="creator" id="a-new" hidden></div>
    </form>
    <datalist id="people-list"></datalist>


    <div class="banner" id="example-banner" hidden>
      <span>Les tâches et thèmes affichés sont des <b>exemples</b> pour vous montrer l'outil.</span>
      <button class="btn ghost" id="clear-examples" type="button">Effacer les exemples</button>
    </div>

    <div id="list" class="main" style="gap:18px"></div>
  </main>
</div>

<dialog id="dlg-task">
  <form class="dlg" id="task-form" method="dialog">
    <h2>Modifier la tâche</h2>
    <label>Intitulé<input class="field" id="e-title" required></label>
    <div class="grid2">
      <label>Thème<select class="field" id="e-theme"></select></label>
      <label>Sous-thème<select class="field" id="e-sub"></select></label>
      <label>Attribuée à<input class="field" id="e-who" list="people-list" placeholder="Personne (pour info)"></label>
      <label>Échéance<input class="field" id="e-due" type="date"></label>
      <label>Répétition<select class="field" id="e-recur">
        <option value="">Ne se répète pas</option>
        <option value="1d">Tous les jours</option>
        <option value="1w">Toutes les semaines</option>
        <option value="2w">Toutes les 2 semaines</option>
        <option value="1m">Tous les mois</option>
        <option value="3m">Tous les trimestres</option>
        <option value="6m">Tous les 6 mois</option>
        <option value="1y">Tous les ans</option>
      </select></label>
      <p class="recur-hint" id="e-recur-hint"></p>
    </div>

      <button class="toggle" id="e-urgent" type="button" aria-pressed="false">Urgent</button>
      <button class="toggle soft" id="e-done" type="button" aria-pressed="false">Terminée</button>
    </div>
    <div class="cledit">
      <span class="lab">Sous-tâches</span>
      <div id="e-cl" class="cledit"></div>
      <div class="item"><input class="field" id="e-cl-new" placeholder="Ajouter une sous-tâche… (Entrée)" aria-label="Nouvelle sous-tâche"><button type="button" class="btn ghost" id="e-cl-add">Ajouter</button></div>
    </div>
    <label>Notes<textarea class="field" id="e-notes" placeholder="Contexte, liens, prochaines étapes…"></textarea></label>
    <div class="actions">
      <button class="btn danger" id="e-delete" type="button">Supprimer</button>
      <span class="spacer"></span>

</dialog>

<dialog id="dlg-themes">
  <div class="dlg">
    <h2>Thèmes et sous-thèmes</h2>
    <div class="themes-list" id="themes-list"></div>
    <form class="row" id="new-theme-form" autocomplete="off">
      <input class="field" id="nt-name" placeholder="Nouveau thème (ex. Recrutement)" style="flex:1 1 200px" aria-label="Nom du nouveau thème">
      <button class="btn" type="submit">Créer le thème</button>
    </form>
    <div class="actions"><span class="spacer"></span><button class="btn ghost" id="themes-close" type="button">Fermer</button></div>
  </div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
const PALETTE=[
  ["Space Indigo","#222E50"],["Dark Cyan","#588B8B"],["Raw Umber","#874000"],["Vibrant Coral","#EF6461"],
  ["Indigo clair","#5A6893"],["Cyan clair","#8DB6B4"],["Ocre","#B8732E"],["Corail doux","#F2908D"]];
/* Anciennes couleurs de thème -> nouvelle palette (affichage uniquement, sans réécrire les données) */
const OLD_COLORS={"#3E63DD":"#222E50","#8E4EC6":"#5A6893","#D6409F":"#EF6461","#E2621B":"#874000","#C98A00":"#B8732E",
  "#30A46C":"#588B8B","#0D9488":"#8DB6B4","#0588F0":"#5A6893","#6B7280":"#5A6893"};
const mapColor=c=>OLD_COLORS[String(c||"").toUpperCase()]||c;
const normTheme=t=>({...t,color:mapColor(t.color),subs:(t.subs||[]).map(x=>({...x,color:x.color?mapColor(x.color):x.color}))});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ---------- Données ---------- */
const S={themes:[],tasks:[],loaded:{themes:false,tasks:false},mode:"pending",stale:false};
let store=null;

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const local={
  async put(col,id,obj){const arr=S[col].filter(x=>x.id!==id);arr.push({...obj,id});S[col]=arr;lsSet("tdp-"+col,arr);render()},
  async del(col,id){S[col]=S[col].filter(x=>x.id!==id);lsSet("tdp-"+col,S[col]);render()}
};
function dbStore(db){return{
  put:(col,id,obj)=>db.collection(col).doc(id).set({...obj,id}),
  del:(col,id)=>db.collection(col).doc(id).delete()
}}
async function save(col,obj){try{await store.put(col,obj.id,obj)}catch(e){toast("Enregistrement impossible : "+(e&&e.message||"erreur"))}}
async function remove(col,id){try{await store.del(col,id)}catch(e){toast("Suppression impossible : "+(e&&e.message||"erreur"))}}

async function init(){
  let db=null;
  try{ if(window.claude&&window.claude.use) db=await window.claude.use("db") }catch(e){db=null}
  if(db){
    S.mode="db";store=dbStore(db);
    const timer=setTimeout(()=>{S.stale=true;render()},10000);
    ["themes","tasks"].forEach(col=>{
      db.collection(col).onSnapshot(snap=>{
        S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));if(col==="themes")S.themes=S.themes.map(normTheme);
        if(!snap.metadata.fromCache){S.loaded[col]=true;if(S.loaded.themes&&S.loaded.tasks){clearTimeout(timer);S.stale=false}}
        render();
      },err=>{clearTimeout(timer);S.loaded[col]=true;toast("Données indisponibles ("+err.code+")");render()});
    });
  }else{
    S.mode="local";store=local;
    S.themes=lsGet("tdp-themes",[]).map(normTheme);S.tasks=lsGet("tdp-tasks",[]);
    S.loaded={themes:true,tasks:true};render();
  }
}

/* ---------- État d'interface ---------- */
const U=Object.assign({theme:null,sub:null,person:null,q:"",group:true,cols:true,showDone:false},lsGet("tdp-ui",{}));
U.q="";
const saveUI=()=>lsSet("tdp-ui",{theme:U.theme,sub:U.sub,person:U.person,group:U.group,cols:U.cols,showDone:U.showDone});
let addUrgent=false;
const showCl=new Set(lsGet("tdp-showcl",[]));

/* ---------- Utilitaires ---------- */
const themeOf=id=>S.themes.find(t=>t.id===id);
const subOf=(t,id)=>t&&(t.subs||[]).find(s=>s.id===id);
const sortedThemes=()=>[...S.themes].sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(b.name,"fr"));
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dueInfo(due){
  if(!due)return null;
  const t=todayISO(), d=new Date(due+"T12:00:00"), n=new Date(t+"T12:00:00");
  const diff=Math.round((d-n)/864e5);
  let txt=d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
  let cls="";
  if(diff<0){cls="late";txt=(diff===-1?"hier":"il y a "+(-diff)+" j")+" · "+txt}
  else if(diff===0){cls="today";txt="aujourd'hui"}
  else if(diff===1){txt="demain"}
  return {txt,cls,late:diff<0};
}
const RECUR={"1d":{n:1,u:"d",short:"Quotidienne",label:"tous les jours"},"1w":{n:7,u:"d",short:"Hebdo",label:"toutes les semaines"},
  "2w":{n:14,u:"d",short:"Toutes les 2 sem.",label:"toutes les 2 semaines"},"1m":{n:1,u:"m",short:"Mensuelle",label:"tous les mois"},
  "3m":{n:3,u:"m",short:"Trimestrielle",label:"tous les trimestres"},"6m":{n:6,u:"m",short:"Semestrielle",label:"tous les 6 mois"},
  "1y":{n:12,u:"m",short:"Annuelle",label:"tous les ans"}};
function nextDue(fromISO,code){
  const r=RECUR[code];const d=new Date((fromISO||todayISO())+"T12:00:00");
  if(r.u==="d")d.setDate(d.getDate()+r.n);
  else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+r.n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* Quand une tâche récurrente est terminée, on crée la suivante (une seule fois) */
function spawnNext(t){
  if(!t.recur||!RECUR[t.recur])return null;
  if(t.nextId&&S.tasks.some(x=>x.id===t.nextId))return null;
  const n={...t,id:uid(),done:false,doneAt:null,nextId:null,example:false,createdAt:Date.now(),
    due:nextDue(t.due,t.recur),checklist:(t.checklist||[]).map(i=>({...i,done:false}))};
  save("tasks",n);showCl.delete(n.id);return n;
}
function fmtDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"long"})}
function initials(n){return String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
const AV=["#222E50","#588B8B","#874000","#EF6461","#5A6893"];const avColor=n=>AV[hue(n)%AV.length];
function hue(n){let h=0;for(const c of String(n).toLowerCase())h=(h*31+c.charCodeAt(0))%360;return h}
function people(){const m=new Map();S.tasks.forEach(t=>{const w=(t.assignee||"").trim();if(!w)return;const k=w.toLowerCase();const e=m.get(k)||{name:w,open:0};if(!t.done)e.open++;m.set(k,e)});return[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,"fr"))}
function cmp(a,b){
  if(!!a.done!==!!b.done)return a.done?1:-1;
  if(!!a.urgent!==!!b.urgent)return a.urgent?-1:1;
  const ad=a.due||"9999",bd=b.due||"9999"; if(ad!==bd)return ad<bd?-1:1;
  return (b.createdAt||0)-(a.createdAt||0);
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

function filtered(ignoreTheme){
  const q=U.q.trim().toLowerCase();
  return S.tasks.filter(t=>{
    if(!ignoreTheme){
      if(U.theme==="__none"){if(themeOf(t.themeId))return false}
      else if(U.theme&&t.themeId!==U.theme)return false;
      if(U.sub&&t.subId!==U.sub)return false;
    }
    if(U.person&&(t.assignee||"").trim().toLowerCase()!==U.person)return false;
    if(q){const th=themeOf(t.themeId),sb=subOf(th,t.subId);
      const hay=[t.title,t.notes,t.assignee,th&&th.name,sb&&sb.name].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}

/* ---------- Rendu ---------- */
function navBtn(key,label,count,pressed,extra=""){return `<li${extra}><button type="button" data-k="${esc(key)}" aria-pressed="${pressed}">${label}<span class="n">${count||""}</span></button></li>`}

function render(){
  const open=S.tasks.filter(t=>!t.done);
  const lateN=open.filter(t=>{const d=dueInfo(t.due);return d&&d.late}).length;
  // Thèmes
  const th=sortedThemes();
  let h=navBtn("t:","<span class=\"lbl\">Tous les thèmes</span>","",!U.theme);
  th.forEach(t=>{
    h+=navBtn("t:"+t.id,`<span class="dot" style="--c:${esc(t.color)}"></span><span class="lbl">${esc(t.name)}</span>`,open.filter(x=>x.themeId===t.id).length,U.theme===t.id&&!U.sub);
    if(U.theme===t.id)(t.subs||[]).forEach(s=>{
      h+=navBtn("s:"+s.id,`<span class="dot" style="--c:${esc(s.color||t.color)}"></span><span class="lbl">${esc(s.name)}</span>`,open.filter(x=>x.subId===s.id).length,U.sub===s.id,' class="sub"');
    });
  });
  if(open.some(x=>!x.themeId||!themeOf(x.themeId)))h+=navBtn("t:__none",'<span class="dot"></span><span class="lbl">Sans thème</span>',open.filter(x=>!x.themeId||!themeOf(x.themeId)).length,U.theme==="__none");
  $("#nav-themes").innerHTML=h;
  // Personnes
  const ppl=people();
  $("#people-sec").hidden=!ppl.length;
  $("#nav-people").innerHTML=ppl.map(p=>navBtn("p:"+p.name.toLowerCase(),`<span class="av" style="--avc:${avColor(p.name)}">${esc(initials(p.name))}</span><span class="lbl">${esc(p.name)}</span>`,p.open,U.person===p.name.toLowerCase())).join("");
  $("#people-list").innerHTML=ppl.map(p=>`<option value="${esc(p.name)}">`).join("");

  // Résumé
  const urgentN=open.filter(t=>t.urgent).length;
  $("#summary").innerHTML=`<div class="stat-card"><span class="ico" style="--c:var(--accent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8 12.5l3 3 5.5-6"/></svg></span><b>${open.length}</b><span class="l">tâche${open.length>1?"s":""} ouverte${open.length>1?"s":""}</span></div>
    <div class="stat-card"><span class="ico" style="--c:var(--urgent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5c2 3 5.5 5.2 5.5 9.5a5.5 5.5 0 0 1-11 0c0-2 1-3.5 2.2-4.6.3 1.6 1.2 2.6 2.3 3.1-.3-3 .2-5.6 1-8z"/></svg></span><b>${urgentN}</b><span class="l">urgente${urgentN>1?"s":""}</span></div>`;

  // Sélecteurs du formulaire d'ajout
  if($("#a-new").hidden){
    fillThemeSelect($("#a-theme"),$("#a-theme").value||U.theme&&U.theme!=="__none"&&U.theme||"");
    fillSubSelect($("#a-sub"),$("#a-theme").value,$("#a-sub").value||U.sub||"");
  }

  $("#t-group").setAttribute("aria-pressed",U.group);
  $("#t-done").setAttribute("aria-pressed",U.showDone);
  $("#t-cols").setAttribute("aria-pressed",U.cols);$("#t-cols").hidden=!U.group;
  $("#example-banner").hidden=!(S.tasks.some(t=>t.example)||S.themes.some(t=>t.example));

  renderList();
}

function fillThemeSelect(sel,val){
  sel.innerHTML='<option value="">Sans thème</option>'+sortedThemes().map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")+'<option value="__new">+ Nouveau thème…</option>';
  sel.value=themeOf(val)?val:"";
}
function fillSubSelect(sel,themeId,val){
  const t=themeOf(themeId),subs=t?t.subs||[]:[];
  sel.innerHTML='<option value="">'+(t?'Sans sous-thème':'Sous-thème')+'</option>'+subs.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")+(t?'<option value="__new">+ Nouveau sous-thème…</option>':'');
  sel.disabled=!t;
  sel.value=subs.some(s=>s.id===val)?val:"";
}

const rk=t=>typeof t.rank==="number"?t.rank:(t.createdAt||0);
function cmpManual(a,b){if(!!a.done!==!!b.done)return a.done?1:-1;if(a.done)return (b.doneAt||0)-(a.doneAt||0);return rk(a)-rk(b)}
function taskHTML(t,drag){
  const th=themeOf(t.themeId),sb=subOf(th,t.subId),d=dueInfo(t.due);
  const chips=[],cl=t.checklist||[],clDone=cl.filter(i=>i.done).length;
  if(t.urgent&&!t.done)chips.push('<span class="pill-u">Urgent</span>');
  if(th)chips.push(`<span class="chip" style="--c:${esc(th.color)}">${esc(th.name)}</span>`);
  if(sb)chips.push(`<span class="chip sub" style="--c:${esc(sb.color||th.color)}">${esc(sb.name)}</span>`);
  if(t.recur&&RECUR[t.recur])chips.push(`<span class="chip rec" title="Tâche récurrente : la suivante est créée quand vous cochez celle-ci">↻ ${esc(RECUR[t.recur].short)}</span>`);
  if(cl.length)chips.push(`<span class="prog${clDone===cl.length?" full":""}" title="Sous-tâches terminées"><span class="bar"><span style="width:${Math.round(clDone/cl.length*100)}%"></span></span>${clDone} sur ${cl.length} sous-tâche${cl.length>1?"s":""}</span>`);
  return `<li class="task${t.urgent&&!t.done?" urgent":""}${t.done?" done":""}">
    <div class="lead">${drag&&!t.done?`<button type="button" class="handle" data-drag="${esc(t.id)}" title="Glisser pour réordonner (ou flèches haut / bas)" aria-label="Déplacer « ${esc(t.title)} » (flèches haut et bas)"><svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true"><g fill="currentColor"><circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></g></svg></button>`:drag?'<span class="handle-sp"></span>':""}
    <input type="checkbox" class="check" data-done="${esc(t.id)}" ${t.done?"checked":""} aria-label="Marquer comme terminée"></div>
    <div class="tmid">
    <button type="button" class="tbody" data-edit="${esc(t.id)}">
      <span class="ttitle">${esc(t.title)}</span>
      ${t.notes?`<span class="tnotes">${esc(t.notes)}</span>`:""}
      ${chips.length?`<span class="meta">${chips.join("")}</span>`:""}
    </button>
    ${(()=>{if(!cl.length)return "";const open=showCl.has(t.id),vis=open?cl:cl.filter(i=>!i.done);
      const items=vis.length?`<ul class="cl">${vis.map(i=>`<li class="${i.done?"ok":""}"><label><input type="checkbox" class="check sm" data-ck="${esc(t.id)}|${esc(i.id)}" ${i.done?"checked":""}><span>${esc(i.text)}</span></label></li>`).join("")}</ul>`:"";
      const more=clDone?`<button type="button" class="cl-more" data-clshow="${esc(t.id)}" aria-expanded="${open}">${open?"Masquer les sous-tâches cochées":(clDone===cl.length?"Toutes les sous-tâches sont cochées · Afficher":"Afficher "+clDone+" cochée"+(clDone>1?"s":""))}</button>`:"";
      return items+more})()}
    </div>
    <div class="side-meta">
      ${t.assignee?`<span class="who-tag" title="Attribuée à ${esc(t.assignee)}"><span class="av" style="--avc:${avColor(t.assignee)}">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:""}
      ${d?`<span class="due ${d.cls}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>${t.done?"":"Échéance : "}${esc(d.txt)}</span>`:""}
    </div>
    <button type="button" class="kebab" data-edit="${esc(t.id)}" aria-label="Ouvrir « ${esc(t.title)} »" title="Ouvrir la tâche"><svg width="4" height="16" viewBox="0 0 4 16" aria-hidden="true"><g fill="currentColor"><circle cx="2" cy="2" r="1.8"/><circle cx="2" cy="8" r="1.8"/><circle cx="2" cy="14" r="1.8"/></g></svg></button>
  </li>`;
}

const folded=new Set(lsGet("tdp-folded",[]));
function ghead(key,mark,title,n,sub){const open=!folded.has(key);
  return `<div class="ghead"><div class="gtitle">${mark}<h3>${esc(title)}</h3><span class="n">${n}</span></div>${sub?`<p class="gsub">${esc(sub)}</p>`:""}<button type="button" class="fold" data-fold="${esc(key)}" aria-expanded="${open}" aria-label="${open?"Replier":"Déplier"} ${esc(title)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>`}
function renderList(){
  if(drag)return;
  const box=$("#list");
  if(!(S.loaded.themes&&S.loaded.tasks)&&!S.tasks.length){
    box.innerHTML=`<div class="empty"><strong>${S.stale?"Vos tâches ne sont pas joignables pour l'instant":"Chargement de vos tâches…"}</strong>${S.stale?"Vérifiez votre connexion ; la liste se mettra à jour toute seule.":"Elles apparaîtront ici dans un instant."}</div>`;return;
  }
  if(!S.tasks.length){box.innerHTML='<div class="empty"><strong>Aucune tâche pour le moment</strong>Écrivez votre première tâche dans le champ ci-dessus, choisissez un thème et appuyez sur Entrée.</div>';return}
  // Tableau Urgent : toujours visible, toutes thématiques confondues
  const urgent=filtered(true).filter(t=>t.urgent&&!t.done).sort(cmp);
  let html=`<section class="group urgent-group">${ghead("urgent",'<span class="dot" style="--c:var(--urgent)"></span>',"Urgent",urgent.length,"À traiter en priorité, tous thèmes confondus.")}
    ${folded.has("urgent")?"":urgent.length?`<ul class="list">${urgent.map(t=>taskHTML(t)).join("")}</ul>`:'<div class="list calm">Aucune tâche urgente. Activez « Urgent » sur une tâche pour la faire remonter ici.</div>'}</section>`;
  // Le reste, par thème
  let items=filtered().filter(t=>!(t.urgent&&!t.done));
  const doneHidden=U.showDone?0:items.filter(t=>t.done).length;
  if(!U.showDone)items=items.filter(t=>!t.done);
  items.sort(cmp);
  if(!items.length){box.innerHTML=html+`<div class="empty"><strong>Aucune autre tâche ${U.theme||U.person||U.q?"avec ces filtres":"en cours"}</strong>${doneHidden?doneHidden+" tâche(s) terminée(s) masquée(s).":""}</div>`;return}
  if(U.group){
    const groups=[];
    sortedThemes().forEach(t=>{const g=items.filter(x=>x.themeId===t.id);if(g.length)groups.push([t,g])});
    const none=items.filter(x=>!themeOf(x.themeId));if(none.length)groups.push([null,none]);
    html+=`<div class="board${U.cols?" cols":""}" style="--n:${Math.max(1,groups.length)}">`+groups.map(([t,g])=>{const key="t:"+(t?t.id:"none"),subs=t?(t.subs||[]).map(x=>x.name):[];
      return `<section class="group">${ghead(key,`<span class="dot" style="--c:${t?esc(t.color):"var(--muted)"}"></span>`,t?t.name:"Sans thème",g.length,subs.length?subs.join(" · "):"")}${folded.has(key)?"":`<ul class="list">${g.sort(cmpManual).map(t=>taskHTML(t,true)).join("")}</ul>`}</section>`}).join("")+"</div>";
  }else html+=`<section class="group">${ghead("others","","Autres tâches",items.length,"Toutes les tâches non urgentes.")}${folded.has("others")?"":`<ul class="list">${items.map(t=>taskHTML(t)).join("")}</ul>`}</section>`;
  if(doneHidden)html+=`<div class="donebar">${doneHidden} tâche${doneHidden>1?"s":""} terminée${doneHidden>1?"s":""} masquée${doneHidden>1?"s":""} · <button class="linkbtn" type="button" id="show-done-inline">Afficher</button></div>`;
  box.innerHTML=html;
}

/* ---------- Création de thème / sous-thème depuis la tâche ---------- */
const clean=v=>v&&v!=="__new"?v:null;
function closeCreator(box){box.hidden=true;box.innerHTML=""}
function wireCreate(selT,selS,box){
  selT.dataset.prev=selT.value;selS.dataset.prev=selS.value;
  selT.addEventListener("change",()=>{
    if(selT.value==="__new"){openCreator("theme",selT,selS,box);return}
    closeCreator(box);selT.dataset.prev=selT.value;fillSubSelect(selS,selT.value,"");selS.dataset.prev="";
  });
  selS.addEventListener("change",()=>{
    if(selS.value==="__new"){openCreator("sub",selT,selS,box);return}
    closeCreator(box);selS.dataset.prev=selS.value;
  });
}
function openCreator(kind,selT,selS,box){
  const parent=kind==="sub"?themeOf(selT.value):null;
  const used=new Set(S.themes.map(t=>t.color));
  let color=kind==="sub"?parent.color:(PALETTE.find(([,c])=>!used.has(c))||PALETTE[S.themes.length%PALETTE.length])[1];
  box.innerHTML=`<span class="ctitle">${kind==="sub"?"Nouveau sous-thème dans « "+esc(parent.name)+" »":"Nouveau thème"}</span>
    <input class="field" data-cname placeholder="${kind==="sub"?"ex. Devis, Relances…":"ex. Clients, Recrutement…"}" aria-label="Nom">
    ${swatches(color,"data-pick",kind==="sub")}
    <button type="button" class="btn" data-cok>Créer</button><button type="button" class="btn ghost" data-cno>Annuler</button>`;
  box.hidden=false;
  const inp=box.querySelector("[data-cname]");inp.focus();
  const cancel=()=>{closeCreator(box);
    if(kind==="theme"){fillThemeSelect(selT,selT.dataset.prev);fillSubSelect(selS,selT.value,selS.dataset.prev)}
    else fillSubSelect(selS,selT.value,selS.dataset.prev)};
  const ok=()=>{
    const name=inp.value.trim();if(!name){inp.focus();return}
    if(kind==="theme"){
      const obj={id:uid(),name,color,subs:[],order:Math.max(0,...S.themes.map(t=>t.order||0))+1};
      S.themes=[...S.themes,obj];save("themes",obj);
      closeCreator(box);fillThemeSelect(selT,obj.id);fillSubSelect(selS,obj.id,"");selT.dataset.prev=obj.id;selS.dataset.prev="";
      render();toast("Thème « "+name+" » créé");
    }else{
      const n=JSON.parse(JSON.stringify(parent));const sub={id:uid(),name,color};
      n.subs=[...(n.subs||[]),sub];n.example=false;
      S.themes=S.themes.map(t=>t.id===n.id?n:t);save("themes",n);
      closeCreator(box);fillSubSelect(selS,n.id,sub.id);selS.dataset.prev=sub.id;
      render();toast("Sous-thème « "+name+" » créé");
    }
  };
  box.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.pick){color=b.dataset.pick;box.querySelectorAll("[data-pick]").forEach(x=>x.setAttribute("aria-pressed",x===b))}
    if(b.hasAttribute("data-cok"))ok();
    if(b.hasAttribute("data-cno"))cancel();};
  box.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ok()}if(e.key==="Escape"){e.preventDefault();e.stopPropagation();cancel()}};
}

/* ---------- Réordonner au sein d'un thème ---------- */
let drag=null;
function commitOrder(id,ul){
  const ids=[...ul.querySelectorAll(".task [data-drag]")].map(b=>b.dataset.drag);
  const list=ids.map(i=>S.tasks.find(t=>t.id===i)).filter(Boolean);
  const i=list.findIndex(t=>t.id===id);if(i<0)return;
  const prev=list[i-1],next=list[i+1],me=list[i];
  let r;
  if(prev&&next)r=(rk(prev)+rk(next))/2;else if(prev)r=rk(prev)+1000;else if(next)r=rk(next)-1000;else return;
  if(prev&&next&&(r<=rk(prev)||r>=rk(next))){
    const base=Date.now();list.forEach((t,k)=>save("tasks",{...t,rank:base+k*1000}));return;
  }
  if(r!==rk(me))save("tasks",{...me,rank:r});
}
$("#list").addEventListener("pointerdown",e=>{
  const h=e.target.closest("[data-drag]");if(!h||e.button>0)return;
  e.preventDefault();const li=h.closest(".task");
  drag={id:h.dataset.drag,li,ul:li.parentElement,moved:false};
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  li.classList.add("dragging");
});
$("#list").addEventListener("pointermove",e=>{
  if(!drag)return;
  const rows=[...drag.ul.querySelectorAll(".task:not(.done)")].filter(r=>r!==drag.li);
  let before=null;
  for(const r of rows){const b=r.getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=r;break}}
  const ref=before||(rows.length?rows[rows.length-1].nextSibling:null);
  if(drag.li.nextSibling!==ref&&drag.li!==ref){drag.ul.insertBefore(drag.li,ref);drag.moved=true}
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;d.li.classList.remove("dragging");
  if(d.moved)commitOrder(d.id,d.ul);
  render();
}
$("#list").addEventListener("pointerup",endDrag);
$("#list").addEventListener("pointercancel",endDrag);
$("#list").addEventListener("keydown",e=>{
  const h=e.target.closest("[data-drag]");if(!h||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;
  e.preventDefault();const li=h.closest(".task"),ul=li.parentElement;
  if(e.key==="ArrowUp"){const p=li.previousElementSibling;if(!p)return;ul.insertBefore(li,p)}
  else{const n=li.nextElementSibling;if(!n||n.classList.contains("done"))return;ul.insertBefore(n,li)}
  const id=h.dataset.drag;commitOrder(id,ul);render();
  const nh=$("#list").querySelector(`[data-drag="${CSS.escape(id)}"]`);nh&&nh.focus();
});

$("#e-urgent").addEventListener("click",()=>{eUrgent=!eUrgent;$("#e-urgent").setAttribute("aria-pressed",eUrgent)});

$("#e-recur").addEventListener("change",recurHint);$("#e-due").addEventListener("change",recurHint);
$("#e-save").addEventListener("click",()=>{
  const t=S.tasks.find(x=>x.id===editing);if(!t)return dlgT.close();
  const title=$("#e-title").value.trim();if(!title){$("#e-title").focus();return}

  if(recur&&!due)due=todayISO();
  const upd={...t,title,themeId:clean($("#e-theme").value),subId:clean($("#e-sub").value),assignee:$("#e-who").value.trim(),recur,
    due,notes:$("#e-notes").value,checklist:(()=>{const v=$("#e-cl-new").value.trim();return v?[...eList,{id:uid(),text:v,done:false}]:eList})(),urgent:eUrgent,done:eDone,doneAt:eDone?(t.doneAt||Date.now()):null,example:false};

  save("tasks",upd);
  dlgT.close();toast(nx?"Terminée · prochaine le "+fmtDate(nx.due):"Tâche enregistrée");

function armed(btn,label,onConfirm){
  if(btn.classList.contains("armed")){onConfirm();return}
  btn.classList.add("armed");btn.textContent=label;clearTimeout(btn._t);btn._t=setTimeout(()=>disarm(btn,btn.dataset.orig),4000);
}
function disarm(btn,orig){btn.classList.remove("armed");btn.textContent=orig;btn.dataset.orig=orig}
$("#e-delete").dataset.orig="Supprimer";
$("#e-delete").addEventListener("click",e=>armed(e.currentTarget,"Confirmer la suppression",()=>{remove("tasks",editing);dlgT.close();toast("Tâche supprimée")}));

/* ---------- Thèmes ---------- */
const dlgTh=$("#dlg-themes");
$("#open-themes").addEventListener("click",()=>{renderThemes();dlgTh.showModal()});
$("#themes-close").addEventListener("click",()=>dlgTh.close());
function swatches(cur,attr,small){return `<div class="swatches">${PALETTE.map(([n,c])=>`<button type="button" class="sw${small?" sm":""}" style="--c:${c}" ${attr}="${c}" aria-label="${n}" title="${n}" aria-pressed="${cur===c}"></button>`).join("")}</div>`}
function renderThemes(){
  const th=sortedThemes();
  $("#themes-list").innerHTML=th.length?th.map(t=>`<div class="tcard" data-theme="${esc(t.id)}">
    <div class="row"><span class="dot" style="--c:${esc(t.color)};width:14px;height:14px"></span>
      <input class="field tname" data-rename="${esc(t.id)}" value="${esc(t.name)}" aria-label="Nom du thème">
      <button type="button" class="iconbtn" data-deltheme="${esc(t.id)}" data-orig="Supprimer">Supprimer</button></div>
    ${swatches(t.color,"data-color")}
    <div class="subs">
      ${(t.subs||[]).map(s=>`<div class="subrow" data-sub="${esc(s.id)}">
        <input class="field" data-subname="${esc(s.id)}" value="${esc(s.name)}" aria-label="Nom du sous-thème">
        ${swatches(s.color||t.color,"data-subcolor",true)}
        <button type="button" class="iconbtn" data-delsub="${esc(s.id)}" data-orig="Retirer">Retirer</button></div>`).join("")}
      <div class="subrow"><input class="field" data-newsub placeholder="Ajouter un sous-thème…" aria-label="Nouveau sous-thème"><button type="button" class="btn ghost" data-addsub>Ajouter</button></div>
    </div></div>`).join(""):'<div class="empty" style="padding:20px"><strong>Aucun thème</strong>Créez votre premier thème ci-dessous, par exemple « Clients » ou « Admin ».</div>';
}
const themesBox=$("#themes-list");
function updTheme(id,fn){const t=themeOf(id);if(!t)return;const n=JSON.parse(JSON.stringify(t));fn(n);n.example=false;save("themes",n).then(()=>{const a=document.activeElement;if(dlgTh.open&&!(a&&a.tagName==="INPUT"&&themesBox.contains(a)))renderThemes()})}
themesBox.addEventListener("click",e=>{
  const card=e.target.closest("[data-theme]");if(!card)return;const id=card.dataset.theme;
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.color)updTheme(id,t=>t.color=b.dataset.color);
  if(b.dataset.subcolor){const sid=b.closest("[data-sub]").dataset.sub;updTheme(id,t=>{const s=t.subs.find(x=>x.id===sid);if(s)s.color=b.dataset.subcolor})}
  if(b.dataset.delsub!==undefined){const sid=b.dataset.delsub;armed(b,"Confirmer",()=>{updTheme(id,t=>t.subs=t.subs.filter(x=>x.id!==sid));
    S.tasks.filter(x=>x.subId===sid).forEach(x=>save("tasks",{...x,subId:null}))})}
  if(b.dataset.deltheme!==undefined){armed(b,"Confirmer : les tâches passent en « Sans thème »",()=>{
    S.tasks.filter(x=>x.themeId===id).forEach(x=>save("tasks",{...x,themeId:null,subId:null}));
    remove("themes",id).then(renderThemes);if(U.theme===id){U.theme=null;U.sub=null;saveUI()}})}
  if(b.hasAttribute("data-addsub")){const inp=card.querySelector("[data-newsub]");addSub(id,inp)}
});
function addSub(id,inp){const name=inp.value.trim();if(!name)return inp.focus();inp.value="";
  const t=themeOf(id);updTheme(id,n=>{n.subs=n.subs||[];n.subs.push({id:uid(),name,color:t.color})});
  setTimeout(()=>{renderThemes();const c=themesBox.querySelector(`[data-theme="${CSS.escape(id)}"] [data-newsub]`);c&&c.focus()},60)}
themesBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.hasAttribute("data-newsub")){e.preventDefault();addSub(e.target.closest("[data-theme]").dataset.theme,e.target)}
  if(e.key==="Enter"&&(e.target.dataset.rename||e.target.dataset.subname)){e.preventDefault();e.target.blur()}});
themesBox.addEventListener("change",e=>{
  const card=e.target.closest("[data-theme]");if(!card)return;const id=card.dataset.theme;const v=e.target.value.trim();
  if(e.target.dataset.rename&&v)updTheme(id,t=>t.name=v);
  if(e.target.dataset.subname&&v){const sid=e.target.dataset.subname;updTheme(id,t=>{const s=t.subs.find(x=>x.id===sid);if(s)s.name=v})}
});
$("#new-theme-form").addEventListener("submit",e=>{
  e.preventDefault();const name=$("#nt-name").value.trim();if(!name)return;
  const used=new Set(S.themes.map(t=>t.color));const color=(PALETTE.find(([,c])=>!used.has(c))||PALETTE[S.themes.length%PALETTE.length])[1];
  const order=Math.max(0,...S.themes.map(t=>t.order||0))+1;
  save("themes",{id:uid(),name,color,subs:[],order}).then(()=>{renderThemes();$("#nt-name").value="";$("#nt-name").focus()});
});

/* ---------- Export / import ---------- */
$("#exp").addEventListener("click",async()=>{
  const strip=o=>{const c={...o};return c};
  const payload=JSON.stringify({app:"carnet-de-taches",version:1,exportedAt:new Date().toISOString(),themes:S.themes.map(strip),tasks:S.tasks.map(strip)},null,2);
  const filename="carnet-de-taches-"+todayISO()+".json";
  let dl=null;
  if(S.mode==="db"){try{dl=await window.claude.use("downloads")}catch(e){dl=null}}
  if(dl){try{await dl.save({filename,data:new Blob([payload],{type:"application/json"})});toast("Export prêt")}catch(e){if(e&&e.code!=="declined")toast("Export impossible ("+(e&&e.code||"erreur")+")")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Fichier exporté")}
  catch(e){toast("Export impossible dans cette vue")}
});
$("#imp").addEventListener("click",()=>$("#imp-file").click());
$("#imp-file").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  let data;try{data=JSON.parse(await f.text())}catch(err){toast("Ce fichier n'est pas un export valide");return}
  const th=Array.isArray(data.themes)?data.themes.filter(x=>x&&x.id):[],tk=Array.isArray(data.tasks)?data.tasks.filter(x=>x&&x.id&&x.title):[];
  if(!th.length&&!tk.length){toast("Aucune tâche trouvée dans ce fichier");return}
  for(const t of th)await save("themes",t);
  for(const t of tk)await save("tasks",t);
  toast(tk.length+" tâche(s) et "+th.length+" thème(s) importés");
});

/* ---------- Exemples ---------- */
$("#clear-examples").addEventListener("click",e=>armed(e.currentTarget,"Confirmer l'effacement",async()=>{
  const ts=S.tasks.filter(t=>t.example),hs=S.themes.filter(t=>t.example);
  for(const t of ts)await remove("tasks",t.id);
  for(const t of hs)await remove("themes",t.id);
  U.theme=null;U.sub=null;U.person=null;saveUI();toast("Exemples effacés");
}));
$("#clear-examples").dataset.orig="Effacer les exemples";

(()=>{const n=new Date(),d=n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("#hello").textContent=n.getHours()<18?"Bonjour !":"Bonsoir !";
  $("#today").textContent=d.charAt(0).toUpperCase()+d.slice(1)+" · on avance une tâche à la fois.";})();
render();init();
})();
